name: Extensão

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extensao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Compilação de produção (sem a página de diagnóstico e sem a ponte de
      # desenvolvimento) e compilação de desenvolvimento.
      - run: npm run build
      - run: npm run build:dev

      # O pacote de produção nunca pode conter a ponte de desenvolvimento.
      - name: Produção sem código de desenvolvimento
        run: |
          if grep -rl "follower-tracker-dev" .output/chrome-mv3; then
            echo "Ponte de desenvolvimento encontrada no pacote de produção" >&2
            exit 1
          fi
          test ! -e .output/chrome-mv3/diagnostics.html

      - run: npm run zip

      - uses: actions/upload-artifact@v7
        with:
          name: elo-instagram-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
          # O WXT grava em .output/, que a action ignora por padrão por ser oculta.
          include-hidden-files: true
